name: Build and Release macOS App (DMG)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'ui/**'
      - 'assets/**'
      - 'macos/**'
      - 'installer/**'
      - 'Cargo.*'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install 7-Zip CLI (sevenzip)
        run: |
          brew install sevenzip

      - name: Build Mickey RAR release binary
        run: |
          cargo build --release --bin mickey-rar

      - name: Build macOS App Bundle and DMG
        run: |
          chmod +x macos/build-dmg.sh
          ./macos/build-dmg.sh

      - name: Upload DMG as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MickeyRAR-macOS-DMG
          path: MickeyRAR-macOS.dmg
          if-no-files-found: error

      - name: Publish Windows Installer & macOS DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "Publishing release $VERSION..."
          ASSETS=("MickeyRAR-macOS.dmg")
          if [ -f "installer/MickeyRAR-Setup.exe" ]; then
            ASSETS+=("installer/MickeyRAR-Setup.exe")
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Uploading assets to existing release $VERSION..."
            gh release upload "$VERSION" "${ASSETS[@]}" --clobber
          else
            echo "Creating official GitHub Release $VERSION..."
            cat <<'EOF' > release_notes.md
          ### What's New / أبرز التحسينات الجديدة
          - **Fast Password Verification:** Instant password validation via header/smallest-file testing without decompressing multi-GB archives twice, plus full browsing of encrypted-header archives (`.7z -mhe=on`, `.rar -hp`).
          - **True Pause & Resume:** Real OS-level process suspension/resuming (`NtSuspendProcess` / `NtResumeProcess`) with accurate elapsed & remaining timers.
          - **In-App Archive Creation, AES-256 Encryption & SFX (.exe):** Full bilingual dialog supporting `ZIP`, `7Z`, and self-extracting `SFX (.exe)` archives with password protection and filename encryption.
          - **Multi-Select & Keyboard Shortcuts:** Single-click selection, double-click open, `Ctrl+Click`, `Shift+Click`, `Ctrl+A`, `Ctrl+O`, `Ctrl+D`, `Ctrl+F`, `Ctrl+C`, `F2`, `F5`, `Delete`, and `Backspace`.
          - **Live Find, Wizard, Info & Editable Address Bar:** Recursive search bar, 4-action quick Wizard, detailed archive statistics modal, editable path input, and instant drive switcher.
          - **Sortable Columns, Theme Persistence & Right-Click Context Menu:** Clickable column sorting (`Names`, `Size`, `Packed`, `Type`, `Modified`, `CRC32`), saved Dark/Light theme preference, in-app context menu, and `F2` rename on disk & inside archives.
          - **Safe Cancellation & Zip-Slip Protection:** Preserves pre-existing empty files on cancel and blocks unsafe path traversal entries.
          EOF
            gh release create "$VERSION" "${ASSETS[@]}" \
              --title "Mickey RAR $VERSION - Major Feature & Performance Update" \
              --notes-file release_notes.md
            rm -f release_notes.md
          fi
          echo "Release $VERSION published successfully!"
